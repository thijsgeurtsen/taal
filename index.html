<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taal oefenen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, Arial, sans-serif;
      background: linear-gradient(135deg, #eef3ff, #f9fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    .uitleg {
      font-size: 18px;
      color: #555;
      margin-bottom: 16px;
    }

    .woordkaart {
      background: #f1f4ff;
      border-radius: 24px;
      padding: 24px;
      margin: 16px 0;
    }

    .woord {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .speaker,
    .kleineKnop,
    .startKnop {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .speaker {
      font-size: 22px;
      padding: 14px 22px;
      border-radius: 18px;
      background: #dde6ff;
    }

    .startKnop {
      font-size: 24px;
      padding: 18px;
      border-radius: 20px;
      background: #e5ecff;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    .plaatjeKnop {
      border: none;
      border-radius: 22px;
      background: #f4f4f4;
      cursor: pointer;
      min-height: 170px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .plaatjeKnop:hover {
      background: #ececec;
    }

    .plaatjeKnop img {
      max-width: 100%;
      max-height: 140px;
      border-radius: 14px;
      object-fit: contain;
    }

    .goed {
      background: #b9f6c3 !important;
    }

    .fout {
      background: #ffc4c4 !important;
    }

    .feedback {
      min-height: 38px;
      font-size: 26px;
      font-weight: bold;
      margin-top: 18px;
    }

    .score {
      margin-top: 10px;
      color: #666;
      font-size: 17px;
    }

    .onderin {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .kleineKnop {
      flex: 1;
      padding: 13px;
      border-radius: 16px;
      background: #eef0f5;
      font-size: 16px;
    }

    .verborgen {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <div id="startScherm">
    <h1>Taal oefenen</h1>
    <p class="uitleg">Luister naar het woord. Kies het goede plaatje.</p>
    <button class="startKnop" onclick="startApp()">Start</button>
  </div>

  <div id="spelScherm" class="verborgen">
    <h1>Woorden oefenen</h1>
    <p class="uitleg">Kies het goede plaatje.</p>

    <div class="woordkaart">
      <div class="woord" id="woord">boek</div>
      <button class="speaker" onclick="spreekHuidigWoord()">🔊 Luister</button>
    </div>

    <div class="grid" id="opties"></div>

    <div class="feedback" id="feedback"></div>
    <div class="score" id="score">Goed: 0 van 0</div>

    <div class="onderin">
      <button class="kleineKnop" onclick="nieuweVraag()">Nieuwe vraag</button>
      <button class="kleineKnop" onclick="resetScore()">Score wissen</button>
    </div>
  </div>

</div>

<script>
const woorden = [
  { woord: "boek", afbeelding: "images/boek.jpg" },
  { woord: "pen", afbeelding: "images/pen.jpg" },
  { woord: "gum", afbeelding: "images/gum.jpg" },
  { woord: "jas", afbeelding: "images/jas.jpg" },
  { woord: "tas", afbeelding: "images/tas.jpg" },
  { woord: "kruk", afbeelding: "images/kruk.jpg" },
  { woord: "tafel", afbeelding: "images/tafel.jpg" },
  { woord: "deur", afbeelding: "images/deur.jpg" },
  { woord: "stoel", afbeelding: "images/stoel.jpg" },
  { woord: "bal", afbeelding: "images/bal.jpg" }
  { woord: "stoel", afbeelding: "images/stoel.jpg" },
];

let huidigWoord = null;
let goed = 0;
let totaal = 0;
let magAntwoorden = true;

function startApp() {
  document.getElementById("startScherm").classList.add("verborgen");
  document.getElementById("spelScherm").classList.remove("verborgen");
  nieuweVraag();
}

function nieuweVraag() {
  magAntwoorden = true;
  document.getElementById("feedback").textContent = "";

  huidigWoord = woorden[Math.floor(Math.random() * woorden.length)];
  document.getElementById("woord").textContent = huidigWoord.woord;

  let opties = [huidigWoord];

  while (opties.length < 4) {
    const extra = woorden[Math.floor(Math.random() * woorden.length)];
    const bestaatAl = opties.some(item => item.woord === extra.woord);

    if (!bestaatAl) {
      opties.push(extra);
    }
  }

  opties.sort(() => Math.random() - 0.5);

  const optiesDiv = document.getElementById("opties");
  optiesDiv.innerHTML = "";

  opties.forEach(optie => {
    const knop = document.createElement("button");
    knop.className = "plaatjeKnop";
    knop.onclick = () => controleer(knop, optie);

    const img = document.createElement("img");
    img.src = optie.afbeelding;
    img.alt = optie.woord;

    knop.appendChild(img);
    optiesDiv.appendChild(knop);
  });

  setTimeout(spreekHuidigWoord, 400);
}

function controleer(knop, gekozen) {
  if (!magAntwoorden) return;

  totaal++;

  if (gekozen.woord === huidigWoord.woord) {
    goed++;
    magAntwoorden = false;

    knop.classList.add("goed");
    document.getElementById("feedback").textContent = "Goed!";

    spreekTekst("goed");
    updateScore();

    setTimeout(nieuweVraag, 1200);
  } else {
    knop.classList.add("fout");
    document.getElementById("feedback").textContent = "Probeer nog een keer";

    spreekTekst("probeer nog een keer");
    updateScore();
  }
}

function spreekHuidigWoord() {
  if (!huidigWoord) return;
  spreekTekst(huidigWoord.woord);
}

function spreekTekst(tekst) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const stem = new SpeechSynthesisUtterance(tekst);
  stem.lang = "nl-NL";
  stem.rate = 0.75;
  stem.pitch = 1;

  window.speechSynthesis.speak(stem);
}

function updateScore() {
  document.getElementById("score").textContent = "Goed: " + goed + " van " + totaal;
}

function resetScore() {
  goed = 0;
  totaal = 0;
  updateScore();
}
</script>

</body>
</html>
